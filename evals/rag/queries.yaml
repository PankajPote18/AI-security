# Labelled retrieval evaluation set: each query names the doc_id(s) that should appear in the
# top results. `expected_doc_ids` is a list because a couple of queries are legitimately answered
# by more than one document - hit@k counts a hit if ANY expected id appears in the top k.
#
# doc_id is the knowledge-base file's path relative to knowledge-base/, without the .md
# extension (exactly what rag_core.loaders.KnowledgeDocument.doc_id produces).

- query: "why do attackers impersonate trusted brands in phishing"
  expected_doc_ids: ["phishing/phishing-overview"]
- query: "what makes phishing psychologically effective"
  expected_doc_ids: ["phishing/phishing-overview", "social-engineering/social-engineering-overview"]
- query: "how does a fake login page steal a password"
  expected_doc_ids: ["phishing/credential-harvesting"]
- query: "reverse proxy phishing kit that steals session cookies during MFA"
  expected_doc_ids: ["phishing/credential-harvesting", "mitre/t1557-adversary-in-the-middle"]
