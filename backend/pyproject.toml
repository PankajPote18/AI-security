[project]
name = "copilot-backend"
version = "0.1.0"
description = "FastAPI backend: auth, URL analysis orchestration, persistence"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "copilot-ml",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "langchain-openai>=0.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "rag-core",
    "security-core",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
copilot-ml = { workspace = true }
security-core = { workspace = true }
rag-core = { workspace = true }
