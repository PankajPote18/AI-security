# Workspace root. Members are added stage by stage (ml + libs/security-core now; backend,
# libs/rag-core, mcp-server later). Shared tool configuration (ruff, mypy, pytest) lives here so
# every package follows one standard.

[project]
name = "ai-security-copilot"
version = "0.1.0"
description = "Evidence-first phishing URL analysis platform (workspace root)"
requires-python = ">=3.12,<3.14"
dependencies = ["copilot-ml", "security-core"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["ml", "libs/security-core"]

[tool.uv.sources]
copilot-ml = { workspace = true }
security-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ml/src", "ml/tests", "libs/security-core/src", "libs/security-core/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["ml/src", "libs/security-core/src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["ml/tests", "libs/security-core/tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
