# Nginx site config template. Install as /etc/nginx/sites-available/copilot, symlink into
# sites-enabled, then run certbot (see docs/deployment.md) which rewrites the TLS block itself.
#
# Replace every <PLACEHOLDER>. This terminates TLS, serves the built React app as static files,
# and reverse-proxies /api to the backend on 127.0.0.1:8000 - the backend is never exposed
# directly to the internet.

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN>;
    # certbot's --nginx mode adds the TLS listen directives and the redirect below itself; this
    # plain :80 block is what it needs to find before that first run.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_DOMAIN>;

    # certbot --nginx fills these in; placeholders so the file is valid before the first run.
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

    # Security headers. CSP is deliberately narrow: this is a single-origin SPA that only ever
    # calls its own /api - it needs no third-party script/style/frame origins.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 1m;  # analyze requests are small JSON; no file uploads anywhere

    # The built frontend (frontend/dist after `npm run build`).
    root <REPO_PATH>/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;  # client-side routing (React Router)
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/v1/analyze/url?mode=deep starts a background task and returns immediately
        # (202); GET polling is short-lived. No endpoint streams or holds a request open, so the
        # default proxy timeouts are fine as-is - raise proxy_read_timeout only if that changes.
    }

    location /health/ {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
