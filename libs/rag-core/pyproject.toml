[project]
name = "rag-core"
version = "0.1.0"
description = "Cybersecurity knowledge RAG pipeline: load, clean, chunk, embed, index, retrieve"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.4",
    "langchain-text-splitters>=0.3",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "typer>=0.12",
]

[project.scripts]
rag-core = "rag_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
