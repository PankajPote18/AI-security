[project]
name = "copilot-ml"
version = "0.1.0"
description = "Phishing URL dataset, feature engineering, training, evaluation and inference"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "pandas>=2.2",
    "pyarrow",
    "tldextract>=5.3",
    "typer>=0.12",
]

[project.scripts]
copilot-ml = "copilot_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_ml"]
