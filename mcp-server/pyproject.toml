[project]
name = "copilot-mcp"
version = "0.1.0"
description = "MCP server exposing the URL-analysis, DNS/RDAP, threat-intel and knowledge-base tools as read-only MCP tools"
requires-python = ">=3.12,<3.14"
dependencies = [
    "copilot-ml",
    "mcp<2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "rag-core",
    "security-core",
]

[project.scripts]
copilot-mcp = "copilot_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_mcp"]
